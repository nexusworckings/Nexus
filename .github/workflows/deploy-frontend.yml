name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin/**'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'robots.txt'
      - '404.html'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build frontend artifact
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r admin dist/
          cp -r css dist/
          cp -r js dist/
          cp -r assets dist/
          cp robots.txt dist/
          cp 404.html dist/
          cp .nojekyll dist/
          # Verify the structure
          find dist -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4